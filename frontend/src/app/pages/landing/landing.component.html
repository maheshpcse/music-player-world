<section class="landing-page">
  <div class="landing-copy">
    <p>Analog soul, modern control</p>
    <h1 class="stream-title typing-title" aria-label="Welcome to Music Player World">
      <span class="title-word" *ngFor="let word of titleWords; let wordIndex = index">
        <span class="title-letter" *ngFor="let char of word.split(''); let charIndex = index" [style.animation-delay.ms]="(wordIndex * 7 + charIndex) * 55">{{ char }}</span>
      </span>
    </h1>
    <span>Browse the public music library, learn about the player, or sign in to open your full Walkman-style listening console.</span>
    <div class="landing-actions">
      <a class="primary-btn btn" routerLink="/login">Login</a>
      <a class="secondary-btn btn" routerLink="/signup">Sign Up</a>
    </div>
  </div>
  <div class="landing-visual" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <i class="bi bi-vinyl"></i>
  </div>
</section>
