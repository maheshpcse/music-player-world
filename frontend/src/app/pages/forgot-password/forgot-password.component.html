<section class="auth-page">
  <div class="auth-copy">
    <p>Account recovery</p>
    <h1>Reset your Music Player password</h1>
    <span>Verify your registered email first, then create a fresh password to return to your music room.</span>
  </div>

  <form class="auth-card needs-validation" *ngIf="step === 'email'" (ngSubmit)="verifyEmail()">
    <h2>Forgot Password</h2>
    <p>Enter the email connected to your account.</p>
    <label class="form-field">
      <i class="bi bi-envelope-check"></i>
      <input class="form-control" type="email" name="email" [(ngModel)]="email" placeholder="Registered email address">
    </label>
    <small class="error" *ngIf="error">{{ error }}</small>
    <button class="primary-btn btn" type="submit" [disabled]="loading">
      <span *ngIf="loading" class="music-loader"><i></i><i></i><i></i></span>
      Verify Email
    </button>
    <span class="switch-link"><a routerLink="/login">Back to login</a></span>
  </form>

  <form class="auth-card needs-validation" *ngIf="step === 'password'" (ngSubmit)="resetPassword()">
    <h2>Create New Password</h2>
    <p>{{ message }}</p>
    <label class="form-field">
      <i class="bi bi-key"></i>
      <input class="form-control" [type]="showNewPassword ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" placeholder="New password">
      <button class="password-toggle" type="button" (click)="showNewPassword = !showNewPassword" [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
        <i class="bi" [ngClass]="showNewPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
      </button>
    </label>
    <label class="form-field">
      <i class="bi bi-shield-lock"></i>
      <input class="form-control" [type]="showConfirmPassword ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm password">
      <button class="password-toggle" type="button" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
        <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
      </button>
    </label>
    <small class="error" *ngIf="error">{{ error }}</small>
    <button class="primary-btn btn" type="submit" [disabled]="loading">
      <span *ngIf="loading" class="music-loader"><i></i><i></i><i></i></span>
      Reset Password
    </button>
    <span class="switch-link"><a routerLink="/login">Back to login</a></span>
  </form>
</section>
