<header class="home-route-nav">
  <nav class="home-mini-nav">
    <a routerLink="/home" routerLinkActive="active">
      <i class="bi bi-boombox"></i> Player
    </a>
    <a routerLink="/library" routerLinkActive="active">
      <i class="bi bi-music-note-list"></i> Library
    </a>
    <a routerLink="/about" routerLinkActive="active">
      <i class="bi bi-info-circle"></i> About
    </a>
    <a routerLink="/contact" routerLinkActive="active">
      <i class="bi bi-envelope-paper"></i> Contact
    </a>

    <a *ngIf="authService.isLoggedIn()" routerLink="/my-account" [class.active]="isProfileRoute">
      <i class="bi bi-person-circle"></i> Profile
    </a>

    <div
      class="profile-tab-menu"
      *ngIf="authService.isLoggedIn()"
      (mouseenter)="cancelMenuClose()"
      (mouseleave)="scheduleMenuClose()">
      <button type="button" class="profile-arrow-button" (click)="toggleMenu()" [class.active]="menuOpen || isProfileRoute" title="Profile menu">
        <i class="bi bi-chevron-down"></i>
      </button>
      <div class="profile-tab-dropdown" *ngIf="menuRendered" [class.open]="menuOpen" (mouseenter)="cancelMenuClose()" (mouseleave)="scheduleMenuClose()">
        <a routerLink="/my-account" routerLinkActive="active" (click)="closeMenu()">
          <i class="bi bi-person-lines-fill"></i> My Account
        </a>
        <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()">
          <i class="bi bi-sliders"></i> Settings
        </a>
        <button type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Sign Out
        </button>
      </div>
    </div>

    <div class="auth-route-actions" *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login">Login</a>
      <a routerLink="/signup">Sign Up</a>
    </div>
  </nav>
</header>
